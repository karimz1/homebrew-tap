name: Update grip
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: read
concurrency:
  group: update-grip
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Find the latest stable published release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GRIP_RELEASE_TOKEN || github.token }}
        run: |
          if ! gh api repos/karimz1/grip/releases/latest > "$RUNNER_TEMP/grip-release.json"; then
            echo 'No accessible published release yet; leaving the current formula unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re
          with open(os.environ['RUNNER_TEMP']+'/grip-release.json') as f:
              release=json.load(f)
          tag=release['tag_name']
          if not release['draft'] and not release['prerelease'] and re.fullmatch(r'v\d+\.\d+\.\d+',tag):
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                  f.write('tag='+tag+'\n')
          PY
      - name: Download and verify release assets
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GRIP_RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo karimz1/grip --dir "$RUNNER_TEMP/grip-release" --pattern grip.rb --pattern checksums.txt --pattern '*.tar.gz'
          python3 scripts/verify_release.py "$RUNNER_TEMP/grip-release" "$TAG"
          ruby -c "$RUNNER_TEMP/grip-release/grip.rb"
          cp "$RUNNER_TEMP/grip-release/grip.rb" Formula/grip.rb
      - name: Commit verified formula
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git diff --quiet -- Formula/grip.rb; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/grip.rb
          git commit -m "grip: update to $TAG"
          git push origin HEAD:main
