name: Formula checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formula and Cask syntax
        run: |
          for formula in Formula/*.rb Casks/*.rb; do
            if [ -f "$formula" ]; then ruby -c "$formula"; fi
          done
          test -L Aliases/oflh
          test "$(readlink Aliases/oflh)" = ../Formula/oflh-cli.rb
      - name: Check release verifier syntax
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
